<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias>
    <family>Book Antiqua</family>
    <prefer><family>Book Antiqua</family></prefer>
  </alias>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Book Antiqua</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Book Antiqua</string>
    </edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
      <string>Book Antiqua</string>
    </test>
    <test name="weight" compare="eq">
      <const>normal</const>
    </test>
    <edit name="file" mode="assign">
      <string>/usr/local/share/fonts/truetype/bka.ttf</string>
    </edit>
  </match>
  <match target="font">
    <test name="family" compare="eq">
      <string>Book Antiqua</string>
    </test>
    <test name="weight" compare="eq">
      <const>bold</const>
    </test>
    <edit name="file" mode="assign">
      <string>/usr/local/share/fonts/truetype/bka-bold.ttf</string>
    </edit>
  </match>
</fontconfig>